<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Habits</h1>
            <p id="date-display">Today</p>
        </header>

        <main id="habit-list">
            <!-- Habits will be injected here -->
            <div class="empty-state" id="empty-state" style="display: none;">
                <p>No habits yet. Start small.</p>
            </div>
        </main>

        <div class="add-habit-container">
            <form id="add-habit-form">
                <input type="text" id="habit-input" placeholder="New habit..." autocomplete="off">
                <button type="submit" aria-label="Add Habit">
                    <i data-lucide="plus"></i>
                </button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
